services:
  app:
    image: git.lan/dev/my-library:latest
    container_name: my-library
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      COVER_STORAGE_PATH: /app/data/covers
      BOOK_FILE_STORAGE_PATH: /app/data/books
      DATABASE_URL: postgresql://library:library@db:5432/library?schema=public
      SESSION_SECRET: replace-with-at-least-32-random-characters
      ALLOWED_DEV_ORIGINS: dev.lan
    volumes:
      - ./covers:/app/data/covers
      - ./book_files:/app/data/books
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: unless-stopped