services:
  app:
    image: node:24-bookworm
    working_dir: /app
    command: sh -c "npm ci && npx playwright install --with-deps chromium && npm run db:generate && npm run db:migrate && npm run dev"
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - covers:/app/data/covers
      - playwright_browsers:/ms-playwright
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  node_modules:
  covers:
  playwright_browsers:
  postgres:
