services:
  app:
    image: git.lan/dev/npm:latest
    container_name: my-library
    stdin_open: true
    tty: true
    ports:
      - 0.0.0.0:5008:5000
    environment:
      PW_TEST_CONNECT_WS_ENDPOINT: ws://playwright:3000/
    networks:
      - development
    working_dir: /home/container/workdir
    volumes:
      - ./:/home/container/workdir
      - /var/run/docker.sock:/var/run/docker.sock
  db:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: library_dev
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d library_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  development:
    external: true
    name: development
