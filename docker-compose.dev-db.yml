name: my-library-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library_dev
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      workspace:
        aliases:
          - library-dev-db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d library_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres:

networks:
  workspace:
    external: true
    name: ${DEV_DOCKER_NETWORK:-my-library-workdir_default}
